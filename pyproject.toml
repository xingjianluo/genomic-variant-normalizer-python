[project]
name = "genomic-variant-normalizer-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)s %(name)s: %(message)s"
log_cli_date_format = "%H:%M:%S"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
